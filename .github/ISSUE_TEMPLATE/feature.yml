name: Feature request
description: Suggest an improvement to gem observation.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to observe or understand?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include an example command or expected manifest when useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
