name: Release
on:
  push:
    tags:
      - 'v*'
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '4.0'
      - run: bundle install
      - name: Verify tag and version
        run: test "${GITHUB_REF_NAME}" = "v$(bundle exec ruby -Ilib -rbonebed/version -e 'print Bonebed::VERSION')"
      - name: Test and build
        run: |
          bundle exec rake
          gem build --strict bonebed.gemspec --output bonebed.gem
      - name: Publish through RubyGems trusted publishing
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes

  container:
    needs: publish
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '3.3'
            image: ruby:3.3@sha256:a91b6ac1b9b18d33812480856e4bc39c5c492ff9c6cc810d916cc3f0cc1d0eab
          - ruby: '3.4'
            image: ruby:3.4@sha256:4116b6119a53dfef69f4cd591784a1aff9e1095b2ef4eccd865e46906e90be36
          - ruby: '4.0'
            image: ruby:4.0.6@sha256:8dc3950712ad2078bdd275b890419ba2fd3aab5a0653b291a7325f0d8a24ca05
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select versioned image
        id: image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          RUBY_VERSION: ${{ matrix.ruby }}
        run: |
          printf 'name=ghcr.io/%s\n' "${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          image="ghcr.io/${REPOSITORY,,}:${RELEASE_TAG#v}"
          printf 'tags<<TAGS\n%s-ruby%s\n' "$image" "$RUBY_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$RUBY_VERSION" = '4.0' ]; then printf '%s\n' "$image" >> "$GITHUB_OUTPUT"; fi
          printf 'TAGS\n' >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.tags }}
          build-args: RUBY_IMAGE=${{ matrix.image }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
