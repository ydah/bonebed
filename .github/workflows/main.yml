name: CI

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: Ruby ${{ matrix.ruby }} (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        ruby:
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Diagnose Ruby 3.3 Bundler layout
        if: matrix.ruby == '3.3'
        run: |
          bundle exec ruby <<'RUBY'
          require "bundler"
          require "json"
          require "rbconfig"
          describe = lambda do |stage|
            spec = Gem.loaded_specs.fetch("bundler")
            puts JSON.pretty_generate(
              stage: stage, version: Bundler::VERSION,
              source: Bundler.method(:root).source_location,
              loaded_features: $LOADED_FEATURES.grep(%r{/bundler\.rb$}),
              default_gem: spec.default_gem?,
              full_gem_path: spec.full_gem_path,
              gem_directory_exists: File.directory?(spec.full_gem_path),
              loaded_from: spec.loaded_from, base_dir: spec.base_dir,
              rubylibdir: RbConfig::CONFIG.fetch("rubylibdir")
            )
          end
          describe.call("bundle exec")
          Bundler.with_unbundled_env do
            Bundler.reset!
            Gem::Specification.reset
            describe.call("after observation environment reset")
          end
          RUBY
      - name: Run the default task
        env:
          BONEBED_COVERAGE_MIN: '85'
        run: bundle exec rake
      - name: Diagnose seccomp support
        run: bundle exec exe/bonebed doctor
      - name: Build gem
        run: gem build --strict bonebed.gemspec --output bonebed.gem
